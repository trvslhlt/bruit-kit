    <a class="back-link" href="/">&larr; All demos</a>
    <h1>ParametricWaveshaperEffect</h1>
    <p class="demo-note">
      A user-defined transfer curve via 5 draggable control points (at
      input -1, -0.5, 0, 0.5, 1) rather than any fixed formula -- the
      defaults trace a straight line, so moving a slider is what
      introduces distortion.
    </p>

    <div id="keyboard"></div>
    <div id="params"></div>
